<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta http-equiv="refresh" content="20">
  <title>Brief maintenance · ChatMCP Space</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #101827; color: #e8edf5; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 0, #18334a 0, #101827 58%); }
    main { width: min(100%, 520px); padding: clamp(28px, 7vw, 52px); border: 1px solid #34465d; border-radius: 22px; background: #172233; box-shadow: 0 28px 90px #07101c88; }
    .mark { display: grid; width: 54px; height: 54px; place-items: center; margin-bottom: 28px; border-radius: 16px; background: #174c48; color: #8ce0c4; font-size: 26px; }
    .status { display: inline-flex; align-items: center; gap: 9px; margin-bottom: 18px; color: #9be0c6; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #68d3aa; box-shadow: 0 0 14px #68d3aa99; }
    h1 { margin: 0; font-size: clamp(30px, 7vw, 42px); letter-spacing: -.04em; line-height: 1.12; }
    p { margin: 18px 0 0; color: #b8c5d6; font-size: 16px; line-height: 1.7; }
    .note { margin-top: 30px; padding-top: 20px; border-top: 1px solid #34465d; color: #91a1b6; font-size: 13px; }
    a { color: #9be0c6; text-underline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <div class="status"><span class="dot" aria-hidden="true"></span> Brief maintenance</div>
    <h1>We’ll be right back.</h1>
    <p>ChatMCP Space is restarting or receiving a quick update. Your agents and conversations are safe. Please try again in a moment.</p>
    <p class="note">This page will check again automatically. You can also <a href="/">reload now</a>.</p>
  </main>
</body>
</html>
