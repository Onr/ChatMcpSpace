name: Sharing regressions

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sharing-regressions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sharing:
    name: Shared chat and message receipts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Check dependency advisories and reproducible stylesheet build
        run: |
          npm audit --audit-level=low
          npm run build:css
          git diff --exit-code -- public/css/tailwind.css
      - name: Check receipt state transitions and delivery handling
        run: npm run test:receipts
      - name: Prepare disposable database and browser prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql ripgrep
          node node_modules/playwright/cli.js install-deps chromium
      - name: Check sharing APIs, agent acknowledgements, colors and mobile scroll
        run: npm run test:sharing
      - name: Check browser layouts and controls
        run: |
          node node_modules/playwright/cli.js install chromium --only-shell
          node node_modules/@playwright/test/cli.js test tests/ui/tailwind-compat.visual.spec.js tests/ui/catchup-settings.visual.spec.js tests/ui/agent-menu-layering.visual.spec.js tests/ui/shared-conversation-list.visual.spec.js --workers=1 --reporter=line
      - name: Save browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sharing-regression-screenshots
          path: |
            test-results/**/*.png
            tests/test-results/**/*.png
            tmp/shared-conversations/*.png
            tmp/guest-sharing/*.png
          if-no-files-found: ignore
          retention-days: 7
